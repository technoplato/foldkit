packages:
  - 'packages/*'
  - 'packages/typing-game/*'
  - 'examples/*'
  - 'examples/*/*'
  - 'comparisons/*'
  - 'internal/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msgpackr-extract: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@effect/platform-browser@4.0.0-beta.97'
  - '@effect/platform-node-shared@4.0.0-beta.97'
  - '@effect/platform-node@4.0.0-beta.97'
  - '@effect/vitest@4.0.0-beta.97'
  - effect@4.0.0-beta.97
  - viem@2.55.10
  - '@expo/cli@57.0.11'
  - '@expo/inline-modules@0.1.4'
  - '@expo/local-build-cache-provider@57.0.5'
  - '@expo/log-box@57.0.2'
  - '@expo/metro-runtime@57.0.8'
  - '@expo/prebuild-config@57.0.10'
  - babel-preset-expo@57.0.5
  - expo-asset@57.0.8
  - expo-constants@57.0.8
  - expo-dev-client@57.0.10
  - expo-dev-launcher@57.0.10
  - expo-dev-menu@57.0.10
  - expo-modules-core@57.0.8
  - expo@57.0.9

overrides:
  effect: 4.0.0-beta.97
  '@effect/platform-browser': 4.0.0-beta.97
  '@effect/platform-node': 4.0.0-beta.97
  '@effect/platform-node-shared': 4.0.0-beta.97
  '@effect/vitest': 4.0.0-beta.97
