<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World | Knophy</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0c1410;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #hud {
        position: absolute;
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        color: #e8f5d8;
        font-size: 13px;
        line-height: 1.35;
        pointer-events: none;
        background: rgba(12, 20, 16, 0.9);
        padding: 10px 12px 11px;
        border-radius: 12px;
        max-width: min(280px, calc(100% - 24px));
        border: 1px solid rgba(232, 245, 216, 0.16);
      }
      .hud-kicker {
        margin: 0 0 8px;
        color: #d7f0b8;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .hud-steps {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .hud-steps li {
        color: #6b7a62;
        margin: 0 0 3px;
      }
      .hud-steps li.is-done {
        color: #3f4a3a;
      }
      .hud-steps li.is-now {
        color: #f3fbe6;
      }
      .hud-now {
        margin: 9px 0 0;
        color: #f3fbe6;
        font-size: 14px;
      }
      .hud-hint {
        margin: 6px 0 0;
        color: #7d8a74;
        font-size: 11px;
      }
      #overlay {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        align-items: flex-end;
        justify-content: center;
        padding: 24px;
      }
      #overlay.open {
        display: flex;
      }
      #dialogue {
        width: min(720px, 100%);
        border: 4px solid #f3ead4;
        background: #16120c;
        color: #f7f1e4;
        padding: 18px 20px 16px;
        box-shadow: 0 12px 40px #000;
      }
      #dialogue .speaker {
        color: #f0c14b;
        letter-spacing: 0.16em;
        font-size: 11px;
        margin: 0 0 8px;
      }
      #dialogue .body {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 20px;
        line-height: 1.45;
        margin: 0;
      }
      #dialogue .hint {
        color: #9a917f;
        font-size: 11px;
        margin: 12px 0 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="hud"></div>
    <div id="overlay" role="dialog" aria-live="polite">
      <div id="dialogue">
        <p class="speaker" id="overlay-speaker"></p>
        <p class="body" id="overlay-body"></p>
        <p class="hint" id="overlay-hint">A / Esc dismiss</p>
      </div>
    </div>
    <script type="module" src="./src/entry.ts"></script>
  </body>
</html>
